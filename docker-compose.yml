services:
  db:
    image: pgvector/pgvector:pg16
    container_name: talon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talon}
      POSTGRES_USER: ${POSTGRES_USER:-talon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talon_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - talon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talon} -d ${POSTGRES_DB:-talon}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  talon-db-data: