server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/talon
    username: talon
    password: talon_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

talon:
  jwt:
    secret: 4a8f9b2c3d1e0f5a7b9c2d4e6f8a0b1c3d5e7f9a1b3c5d7e9f0a2b4c6d8e0f1a
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  llm:
    enabled: true
    base-url: https://generativelanguage.googleapis.com/v1beta/openai/
    api-key: ""
    model: gemini-1.5-flash